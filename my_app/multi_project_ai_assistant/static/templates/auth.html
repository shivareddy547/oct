<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - Multi-Project AI Assistant</title>
    <link rel="stylesheet" href="/static/public/app.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .auth-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
        }
        .auth-tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            border-bottom: 3px solid transparent;
        }
        .auth-tab.active {
            border-bottom-color: #007bff;
            font-weight: bold;
        }
        .auth-form {
            display: none;
        }
        .auth-form.active {
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .auth-btn:hover {
            background: #0056b3;
        }
        .auth-link {
            text-align: center;
            margin-top: 15px;
        }
        .status-message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
<div class="header">
    <h1>Multi-Project AI Assistant 🤖</h1>
    <div class="subtitle">Create and manage your AI-powered projects</div>
</div>

<div class="auth-container">
    <div class="auth-tabs">
        <div class="auth-tab active" onclick="showAuthForm('login')">Login</div>
        <div class="auth-tab" onclick="showAuthForm('signup')">Sign Up</div>
        <div class="auth-tab" onclick="showAuthForm('forgot')">Forgot Password</div>
    </div>

    <!-- Login Form -->
    <div id="login-form" class="auth-form active">
        <h3>Welcome Back</h3>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="login-email" placeholder="Enter your email">
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="login-password" placeholder="Enter your password">
        </div>
        <button class="auth-btn" onclick="login()">Login</button>
        <div class="auth-link">
            <a href="#" onclick="showAuthForm('forgot')">Forgot your password?</a>
        </div>
        <div id="login-status"></div>
    </div>

    <!-- Signup Form -->
    <div id="signup-form" class="auth-form">
        <h3>Create Account</h3>
        <div class="form-group">
            <label>Username:</label>
            <input type="text" id="signup-username" placeholder="Choose a username">
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="signup-email" placeholder="Enter your email">
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="signup-password" placeholder="Create a password">
        </div>
        <div class="form-group">
            <label>Confirm Password:</label>
            <input type="password" id="signup-confirm-password" placeholder="Confirm your password">
        </div>
        <button class="auth-btn" onclick="signup()">Create Account</button>
        <div id="signup-status"></div>
    </div>

    <!-- Forgot Password Form -->
    <div id="forgot-form" class="auth-form">
        <h3>Reset Password</h3>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="forgot-email" placeholder="Enter your email">
        </div>
        <button class="auth-btn" onclick="forgotPassword()">Send Reset Link</button>
        <div class="auth-link">
            <a href="#" onclick="showAuthForm('login')">Back to Login</a>
        </div>
        <div id="forgot-status"></div>
    </div>

    <!-- Reset Password Form (shown when token is present) -->
    <div id="reset-form" class="auth-form">
        <h3>Set New Password</h3>
        <div class="form-group">
            <label>New Password:</label>
            <input type="password" id="reset-password" placeholder="Enter new password">
        </div>
        <div class="form-group">
            <label>Confirm Password:</label>
            <input type="password" id="reset-confirm-password" placeholder="Confirm new password">
        </div>
        <button class="auth-btn" onclick="resetPassword()">Reset Password</button>
        <div id="reset-status"></div>
    </div>
</div>

<script>
    function showAuthForm(formName) {
        // Hide all forms and remove active class from tabs
        document.querySelectorAll('.auth-form').forEach(form => {
            form.classList.remove('active');
        });
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.classList.remove('active');
        });

        // Show selected form and activate tab
        document.getElementById(`${formName}-form`).classList.add('active');
        event.target.classList.add('active');
    }

    function login() {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        const status = document.getElementById('login-status');

        if (!email || !password) {
            showStatus(status, 'Please fill in all fields', 'error');
            return;
        }

        fetch('/api/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ email, password })
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Store authentication data
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    showStatus(status, 'Login successful! Redirecting...', 'success');

                    // Redirect to main application
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    showStatus(status, data.error || 'Login failed', 'error');
                }
            })
            .catch(error => {
                showStatus(status, 'Error: ' + error, 'error');
            });
    }

    function signup() {
        const username = document.getElementById('signup-username').value;
        const email = document.getElementById('signup-email').value;
        const password = document.getElementById('signup-password').value;
        const confirmPassword = document.getElementById('signup-confirm-password').value;
        const status = document.getElementById('signup-status');

        if (!username || !email || !password || !confirmPassword) {
            showStatus(status, 'Please fill in all fields', 'error');
            return;
        }

        if (password !== confirmPassword) {
            showStatus(status, 'Passwords do not match', 'error');
            return;
        }

        if (password.length < 6) {
            showStatus(status, 'Password must be at least 6 characters', 'error');
            return;
        }

        fetch('/api/signup', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ username, email, password })
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showStatus(status, 'Account created successfully! Please login.', 'success');
                    setTimeout(() => {
                        showAuthForm('login');
                    }, 2000);
                } else {
                    showStatus(status, data.error || 'Signup failed', 'error');
                }
            })
            .catch(error => {
                showStatus(status, 'Error: ' + error, 'error');
            });
    }

    function forgotPassword() {
        const email = document.getElementById('forgot-email').value;
        const status = document.getElementById('forgot-status');

        if (!email) {
            showStatus(status, 'Please enter your email', 'error');
            return;
        }

        fetch('/api/forgot_password', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ email })
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showStatus(status, 'Password reset link sent to your email', 'success');
                } else {
                    showStatus(status, data.error || 'Failed to send reset link', 'error');
                }
            })
            .catch(error => {
                showStatus(status, 'Error: ' + error, 'error');
            });
    }

    function resetPassword() {
        const password = document.getElementById('reset-password').value;
        const confirmPassword = document.getElementById('reset-confirm-password').value;
        const status = document.getElementById('reset-status');
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!password || !confirmPassword) {
            showStatus(status, 'Please fill in all fields', 'error');
            return;
        }

        if (password !== confirmPassword) {
            showStatus(status, 'Passwords do not match', 'error');
            return;
        }

        fetch('/api/reset_password', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ token, password })
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showStatus(status, 'Password reset successfully! Please login.', 'success');
                    setTimeout(() => {
                        window.location.href = '/auth';
                    }, 2000);
                } else {
                    showStatus(status, data.error || 'Password reset failed', 'error');
                }
            })
            .catch(error => {
                showStatus(status, 'Error: ' + error, 'error');
            });
    }

    function showStatus(element, message, type) {
        element.innerHTML = `<div class="status-message ${type}">${message}</div>`;
    }

    // Check if reset token is present in URL
    document.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (token) {
            showAuthForm('reset');
        }
    });
</script>
</body>
</html>
